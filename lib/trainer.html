<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Go60 Trainer</title>
<style>
  :root { --bg: #16181d; --fg: #e6e6e6; --dim: #7b8190; --key: #262a33; --edge: #3a404c;
          --hold: #f0b45a; --sel: #5aa9f0; --trans: #1d2027; --danger: #e5534b; --combo: #b48ef0; }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 1rem 1.5rem; background: var(--bg); color: var(--fg);
         font: 15px/1.4 system-ui, sans-serif; }
  h1 { font-size: 1.1rem; margin: 0 0 .25rem; }
  .title { color: var(--dim); margin-bottom: .75rem; }
  #layers { display: flex; flex-wrap: wrap; gap: .3rem; margin-bottom: 1rem; }
  #layers button { background: var(--key); color: var(--fg); border: 1px solid var(--edge);
                   border-radius: 4px; padding: .25rem .6rem; font: inherit; cursor: pointer; }
  #layers button[aria-pressed="true"] { border-color: var(--sel); color: var(--sel); }
  svg { width: 100%; max-width: 1100px; display: block; }
  .k rect { fill: var(--key); stroke: var(--edge); stroke-width: 1; }
  .k { cursor: pointer; }
  .k.trans rect { fill: var(--trans); stroke-dasharray: 3 3; }
  .k.none rect { fill: var(--bg); }
  .k.danger rect { stroke: var(--danger); }
  .k.sel rect { stroke: var(--sel); stroke-width: 3; }
  .k text { fill: var(--fg); text-anchor: middle; dominant-baseline: central; pointer-events: none; }
  .k .hold { fill: var(--hold); font-size: 9px; }
  .k.trans .tap { fill: var(--dim); }
  #info { margin-top: 1rem; min-height: 4.5rem; max-width: 1100px; padding: .75rem 1rem;
          border: 1px solid var(--edge); border-radius: 6px; }
  #info .where { color: var(--dim); }
  #info .danger { color: var(--danger); }
  .legend { color: var(--dim); font-size: .85rem; margin-top: .5rem; }
  .legend b { color: var(--hold); font-weight: normal; }
  .legend .t { color: var(--sel); }
  #layers .group { display: flex; flex-wrap: wrap; gap: .3rem; align-items: center; margin-right: 1rem; }
  #layers .group span { color: var(--dim); }
  .find { display: flex; gap: 1rem; align-items: center; margin-bottom: .4rem; }
  .find input[type=search] { width: 26rem; background: var(--key); color: var(--fg); border: 1px solid var(--edge);
                             border-radius: 4px; padding: .3rem .5rem; font: inherit; }
  #found { min-height: 1.4em; color: var(--sel); }
  #note { max-width: 1100px; margin: .4rem 0; }
  #ways { display: flex; flex-wrap: wrap; gap: .3rem; align-items: center; margin-bottom: .6rem; }
  #ways button { background: var(--key); color: var(--fg); border: 1px solid var(--edge); border-radius: 4px;
                 padding: .15rem .5rem; font: inherit; font-size: .85rem; cursor: pointer; }
  #ways button[aria-pressed="true"] { border-color: var(--hold); }
  .k.h-hold rect { stroke: var(--hold); stroke-width: 3; }
  .k.h-tap rect { stroke: var(--sel); stroke-width: 3; fill: #24364a; }
  .combo polyline { fill: none; stroke: var(--combo); stroke-width: 2; opacity: .8; }
  .combo circle { fill: var(--combo); }
  .combo rect { fill: var(--bg); stroke: var(--combo); }
  .combo text { fill: var(--combo); font-size: 10px; text-anchor: middle; dominant-baseline: central; }
  .combo { pointer-events: visiblePainted; }
  #drill { max-width: 1100px; margin-bottom: 1rem; }
  #drill-menu ol { margin: .3rem 0; padding-left: 1.5rem; }
  #drill-menu li[aria-current="true"] { color: var(--sel); }
  #drill-menu .letters { color: var(--dim); }
  #drill-text { font: 1.6rem/1.7 ui-monospace, monospace; white-space: pre; margin: .5rem 0; }
  #drill-text .done { color: var(--dim); }
  #drill-text .cur { background: #24364a; border-bottom: 2px solid var(--sel); }
  #drill-text .cur.bad { background: #4a2424; border-bottom-color: var(--danger); }
  #drill-stats { font-size: 1.2rem; color: var(--sel); min-height: 1.4em; }
  body.drilling #layers, body.drilling .find, body.drilling #found, body.drilling #note,
  body.drilling #ways, body.drilling #info, body.drilling .legend { display: none; }
  body.drilling.nopic #board { display: none; }
</style>
</head>
<body>
<h1>Go60 Trainer · <span id="mode">Explore</span></h1>
<div class="title" id="title"></div>
<nav id="layers" aria-label="Layers"></nav>
<div class="find"><label>Find <input id="search" type="search" placeholder="a character or key: {  F1  Ctrl  A  Ctrl+Z  Bootloader" autocomplete="off"></label>
  <label><input id="show-combos" type="checkbox" checked> combos</label></div>
<div id="found" aria-live="polite"></div>
<p id="note"></p>
<div id="ways"></div>
<section id="drill" hidden>
  <div id="drill-menu"></div>
  <div id="drill-text"></div>
  <div id="drill-stats" aria-live="polite"></div>
  <div id="drill-hint" class="where"></div>
</section>
<svg id="board" role="img" aria-label="Go60 keys on the chosen layer"></svg>
<div class="legend">Top: tap. <b>Bottom: hold.</b> Dashed: pass-through (shows what it falls through to). Linked dots: a combo, pressed together.
  Found: <b>hold</b> these, <span class="t">tap</span> these. Select a key to see what it sends; ← → change layer; / to find; d to drill.</div>
<section id="info" aria-live="polite">Select a key.</section>

<script id="data-layout" type="application/json">{{layout}}</script>
<script id="data-keys" type="application/json">{{keys}}</script>

<script id="reach">
// Reach: everything that reads the Layout's structure. Loadable by Node with no browser (tests/page.js).
var Reach = (function () {
  'use strict';

  var CHAR = { N1: '1', N2: '2', N3: '3', N4: '4', N5: '5', N6: '6', N7: '7', N8: '8', N9: '9', N0: '0',
    MINUS: '-', EQUAL: '=', LBKT: '[', RBKT: ']', BSLH: '\\', SEMI: ';', SQT: "'", SINGLE_QUOTE: "'",
    APOS: "'", GRAVE: '`', COMMA: ',', DOT: '.', FSLH: '/', EXCL: '!', AT: '@', HASH: '#', DLLR: '$',
    PRCNT: '%', CARET: '^', AMPS: '&', STAR: '*', ASTRK: '*', LPAR: '(', RPAR: ')', UNDER: '_',
    PLUS: '+', LBRC: '{', RBRC: '}', PIPE: '|', COLON: ':', DQT: '"', TILDE: '~', LT: '<', GT: '>',
    QMARK: '?', KP_N0: '0', KP_N1: '1', KP_N2: '2', KP_N3: '3', KP_N4: '4', KP_N5: '5', KP_N6: '6',
    KP_N7: '7', KP_N8: '8', KP_N9: '9', KP_DOT: '.', KP_PLUS: '+', KP_MINUS: '-', KP_MULTIPLY: '*',
    KP_DIVIDE: '/', KP_EQUAL: '=', KP_COMMA: ',' };
  var SHIFTED = { N1: '!', N2: '@', N3: '#', N4: '$', N5: '%', N6: '^', N7: '&', N8: '*', N9: '(', N0: ')',
    MINUS: '_', EQUAL: '+', LBKT: '{', RBKT: '}', BSLH: '|', SEMI: ':', SQT: '"', SINGLE_QUOTE: '"',
    APOS: '"', GRAVE: '~', COMMA: '<', DOT: '>', FSLH: '?' };
  // [label on the key, plain words]
  var NAMED = { SPACE: ['␣', 'Space'], RET: ['⏎', 'Enter'], ENTER: ['⏎', 'Enter'], BSPC: ['⌫', 'Backspace'],
    DEL: ['Del', 'Delete'], TAB: ['⇥', 'Tab'], ESC: ['Esc', 'Escape'], INS: ['Ins', 'Insert'],
    HOME: ['Home', 'Home'], END: ['End', 'End'], PG_UP: ['PgUp', 'Page Up'], PG_DN: ['PgDn', 'Page Down'],
    UP: ['↑', 'Up arrow'], DOWN: ['↓', 'Down arrow'], LEFT: ['←', 'Left arrow'], RIGHT: ['→', 'Right arrow'],
    CAPS: ['Caps', 'Caps Lock'], PSCRN: ['PrtSc', 'Print Screen'], SLCK: ['ScrLk', 'Scroll Lock'],
    PAUSE_BREAK: ['Pause', 'Pause'], K_APP: ['Menu', 'Menu key'], KP_NUM: ['NumLk', 'Num Lock'],
    KP_ENTER: ['⏎', 'keypad Enter'],
    C_VOL_UP: ['Vol+', 'Volume up'], C_VOL_DN: ['Vol−', 'Volume down'], C_MUTE: ['Mute', 'Mute'],
    C_PP: ['⏯', 'Play/Pause'], C_PLAY: ['▶', 'Play'], C_NEXT: ['⏭', 'Next track'], C_PREV: ['⏮', 'Previous track'],
    C_BRI_UP: ['Bri+', 'Screen brighter'], C_BRI_DN: ['Bri−', 'Screen dimmer'] };
  // Modifier keys and the functions that wrap a key in one, e.g. LS(N1).
  var MODS = { LSHFT: 'Shift', RSHFT: 'Shift', LSHIFT: 'Shift', RSHIFT: 'Shift', LCTRL: 'Ctrl', RCTRL: 'Ctrl',
    LALT: 'Alt', RALT: 'Alt', LGUI: 'GUI', RGUI: 'GUI', LWIN: 'GUI', RWIN: 'GUI', LCMD: 'GUI', RCMD: 'GUI' };
  var MODFN = { LS: 'Shift', RS: 'Shift', LC: 'Ctrl', RC: 'Ctrl', LA: 'Alt', RA: 'Alt', LG: 'GUI', RG: 'GUI' };
  var MODSYM = { Shift: '⇧', Ctrl: '⌃', Alt: '⌥', GUI: '◆' };
  var MOUSE = { LCLK: 'Left click', RCLK: 'Right click', MCLK: 'Middle click', MB4: 'Back button',
    MB5: 'Forward button', MOVE_UP: 'Pointer up', MOVE_DOWN: 'Pointer down', MOVE_LEFT: 'Pointer left',
    MOVE_RIGHT: 'Pointer right', SCRL_UP: 'Scroll up', SCRL_DOWN: 'Scroll down', SCRL_LEFT: 'Scroll left',
    SCRL_RIGHT: 'Scroll right' };
  var MOUSELABEL = { LCLK: 'LClk', RCLK: 'RClk', MCLK: 'MClk', MB4: 'Back', MB5: 'Fwd', MOVE_UP: '🖱↑',
    MOVE_DOWN: '🖱↓', MOVE_LEFT: '🖱←', MOVE_RIGHT: '🖱→', SCRL_UP: '⇞', SCRL_DOWN: '⇟', SCRL_LEFT: '⇜',
    SCRL_RIGHT: '⇝' };

  function val(p) { return p && p.value; }

  // A key code, possibly wrapped in modifier functions: {mods: [...], code}.
  function parseKey(p) {
    if (p && MODFN[p.value] && p.params && p.params.length) {
      var inner = parseKey(p.params[0]);
      return { mods: [MODFN[p.value]].concat(inner.mods), code: inner.code };
    }
    return { mods: [], code: String(val(p)) };
  }

  function keyChar(k) {
    var shift = k.mods.filter(function (m) { return m === 'Shift'; }).length;
    if (k.mods.length !== shift) return null;
    if (/^[A-Z]$/.test(k.code)) return shift ? k.code : k.code.toLowerCase();
    if (shift) return SHIFTED[k.code] || null;
    return CHAR[k.code] || null;
  }

  function keyName(k, short) {
    var c = keyChar(k);
    if (c !== null) return short ? (/^[a-z]$/.test(c) ? c.toUpperCase() : c) : '“' + c + '”';
    var base = { mods: [], code: k.code };
    var b = MODS[k.code] ? (short ? MODS[k.code] : (/^R/.test(k.code) ? 'Right ' : 'Left ') + MODS[k.code])
      : NAMED[k.code] ? NAMED[k.code][short ? 0 : 1]
      : keyChar(base) !== null ? keyChar(base).toUpperCase()
      : k.code;
    var mods = k.mods.filter(function (m, i, a) { return a.indexOf(m) === i; });
    if (short) return mods.map(function (m) { return MODSYM[m]; }).join('') + b;
    return mods.concat([b]).join('+');
  }

  function layerName(layout, n) { return layout.layer_names[n] !== undefined ? layout.layer_names[n] : 'layer ' + n; }

  // The editor's &magic holds the layer that carries the bootloader keys, whatever it is named.
  function magicLayer(layout) {
    for (var n = 0; n < layout.layers.length; n++)
      if (layout.layers[n].some(function (b) { return b && b.value === '&bootloader'; })) return n;
    return null;
  }

  function find(list, name) {
    for (var i = 0; i < (list || []).length; i++) if (list[i].name === name) return list[i];
    return null;
  }

  // What a binding does, as a tree: key, layer, holdtap, macro, sticky, mouse, special, trans, none.
  function resolve(layout, b, depth) {
    depth = (depth || 0) + 1;
    if (depth > 12) return { kind: 'special', label: '…', words: 'a behaviour nested too deep to show' };
    var v = b.value, ps = b.params || [];
    switch (v) {
      case '&kp': return { kind: 'key', key: parseKey(ps[0]) };
      case '&trans': return { kind: 'trans' };
      case '&none': return { kind: 'none' };
      case '&mo': return { kind: 'layer', how: 'hold', layer: val(ps[0]) };
      case '&to': return { kind: 'layer', how: 'to', layer: val(ps[0]) };
      case '&tog': return { kind: 'layer', how: 'toggle', layer: val(ps[0]) };
      case '&layer': return { kind: 'layer', how: 'dance', layer: val(ps[0]) };
      case '&sk': return { kind: 'sticky', key: parseKey(ps[0]) };
      case '&caps_word': return { kind: 'special', label: 'CapsW', name: 'Caps Word', words: 'Caps Word: types the next word in capitals' };
      case '&key_repeat': return { kind: 'special', label: 'Rpt', name: 'Repeat', words: 'repeats the last key' };
      case '&magic': return { kind: 'holdtap',
        hold: { kind: 'layer', how: 'hold', layer: ps[0] !== undefined ? val(ps[0]) : magicLayer(layout) },
        tap: { kind: 'special', label: '✦', name: 'Status', words: 'shows the status lights' } };
      case '&bootloader': return { kind: 'special', danger: true, label: 'Boot', name: 'Bootloader',
        words: 'Bootloader: this half stops being a keyboard and waits for new firmware' };
      case '&reset': case '&sys_reset': return { kind: 'special', danger: true, label: 'Reset', name: 'Reset', words: 'Reset: restarts this half' };
      case '&bt': return bt(val(ps[0]), val(ps[1]));
      case '&out': return { kind: 'special', label: val(ps[0]) === 'OUT_USB' ? 'USB' : val(ps[0]) === 'OUT_BLE' ? 'BLE' : 'Out',
        words: val(ps[0]) === 'OUT_USB' ? 'sends keys over USB' : val(ps[0]) === 'OUT_BLE' ? 'sends keys over Bluetooth' : 'toggles USB or Bluetooth output' };
      case '&rgb_ug': return { kind: 'special', label: String(val(ps[0])).replace(/^RGB_/, ''), words: 'lights: ' + rgb(val(ps[0])) };
      case '&mkp': case '&mmv': case '&msc':
        return { kind: 'mouse', label: MOUSELABEL[val(ps[0])] || val(ps[0]), words: MOUSE[val(ps[0])] || String(val(ps[0])) };
    }
    var m = /^&bt_(\d+)$/.exec(v);
    if (m) return bt('BT_SEL', Number(m[1]));
    var ht = find(layout.holdTaps, v);
    if (ht) return {
      kind: 'holdtap',
      triggers: ht.holdTriggerKeyPositions || null,
      onRelease: !!ht.holdTriggerOnRelease,
      hold: resolve(layout, { value: ht.bindings[0], params: ps[0] !== undefined ? [ps[0]] : [] }, depth),
      tap: resolve(layout, { value: ht.bindings[1], params: ps[1] !== undefined ? [ps[1]] : [] }, depth)
    };
    var mac = find(layout.macros, v);
    if (mac) return macro(layout, mac, ps, depth);
    return { kind: 'special', label: v.replace(/^&/, ''), words: 'behaviour ' + v };
  }

  function bt(cmd, n) {
    if (cmd === 'BT_CLR') return { kind: 'special', danger: true, label: 'BT Clr', name: 'Bluetooth clear', words: 'clears the pairing of the current Bluetooth profile' };
    if (cmd === 'BT_CLR_ALL') return { kind: 'special', danger: true, label: 'BT Clr*', name: 'Bluetooth clear all', words: 'clears every Bluetooth pairing' };
    if (cmd === 'BT_SEL') return { kind: 'special', label: 'BT' + n, words: 'switches to Bluetooth profile ' + n };
    if (cmd === 'BT_NXT') return { kind: 'special', label: 'BT→', words: 'next Bluetooth profile' };
    if (cmd === 'BT_PRV') return { kind: 'special', label: 'BT←', words: 'previous Bluetooth profile' };
    return { kind: 'special', label: 'BT', words: 'Bluetooth: ' + cmd };
  }

  function rgb(c) {
    var w = { RGB_TOG: 'on or off', RGB_BRI: 'brighter', RGB_BRD: 'dimmer', RGB_HUI: 'next hue', RGB_HUD: 'previous hue',
      RGB_SAI: 'more saturated', RGB_SAD: 'less saturated', RGB_SPI: 'faster effect', RGB_SPD: 'slower effect',
      RGB_EFF: 'next effect', RGB_EFR: 'previous effect' };
    return w[c] || String(c);
  }

  // Walk a macro's bindings: what it holds while the key is down, and what it types.
  function macro(layout, mac, ps, depth) {
    var mode = 'tap', subs = [], pressed = [], held = null, steps = [], letsGo = false;
    mac.bindings.forEach(function (b) {
      var pm = /^&macro_param_(\d)to(\d)$/.exec(b.value);
      if (pm) { subs.push([pm[1] - 1, pm[2] - 1]); return; }
      if (b.value === '&macro_tap') { mode = 'tap'; return; }
      if (b.value === '&macro_press') { mode = 'press'; return; }
      if (b.value === '&macro_release') { mode = 'release'; return; }
      if (b.value === '&macro_pause_for_release') { held = pressed.slice(); return; }
      if (/^&macro_/.test(b.value)) return;
      var params = (b.params || []).slice();
      subs.forEach(function (s) { if (ps[s[0]] !== undefined) params[s[1]] = ps[s[0]]; });
      subs = [];
      if (held) return;
      var d = resolve(layout, { value: b.value, params: params }, depth);
      var key = JSON.stringify(d);
      if (mode === 'press') pressed.push(d);
      else if (mode === 'release') {
        var i = pressed.map(JSON.stringify).indexOf(key);
        if (i >= 0) pressed.splice(i, 1);
        else letsGo = true;
      } else {
        var mods = [];
        pressed.forEach(function (p) { if (p.kind === 'key' && MODS[p.key.code]) mods.push(MODS[p.key.code]); });
        if (d.kind === 'key' && mods.length) d = { kind: 'key', key: { mods: mods.concat(d.key.mods), code: d.key.code } };
        steps.push(d);
      }
    });
    held = held || [];
    if (!letsGo && !steps.length && held.length === 1) return held[0];
    if (!letsGo && !held.length && steps.length === 1) return steps[0];
    return { kind: 'macro', held: held, steps: steps, letsGo: letsGo };
  }

  function label(layout, d) {
    switch (d.kind) {
      case 'key': return keyName(d.key, true);
      case 'sticky': return '1×' + keyName(d.key, true);
      case 'layer': return (d.how === 'to' ? '→' : d.how === 'toggle' ? '⇄' : '') + layerName(layout, d.layer);
      case 'holdtap': return label(layout, d.tap);
      case 'macro':
        if (d.steps.length) return d.steps.map(function (s) { return label(layout, s); }).join('');
        // What it sends first, then the layers it holds.
        return d.held.filter(function (s) { return s.kind !== 'layer'; }).concat(d.held.filter(function (s) { return s.kind === 'layer'; }))
          .map(function (s) { return label(layout, s); }).join('+');
      case 'none': return '';
      case 'trans': return '▽';
      default: return d.label;
    }
  }

  // What a hold does, as a short label: a modifier's name, a layer's name.
  function holdLabel(layout, d) {
    if (d.kind === 'key' && MODS[d.key.code] && !d.key.mods.length) return MODS[d.key.code];
    if (d.kind === 'layer') return layerName(layout, d.layer);
    if (d.kind === 'macro' && !d.steps.length) {
      var ks = d.held.filter(function (h) { return h.kind === 'key'; });
      return (ks.length ? ks : d.held).map(function (h) { return holdLabel(layout, h); }).join('+');
    }
    return label(layout, d);
  }

  function words(layout, d) {
    switch (d.kind) {
      case 'key': return keyChar(d.key) !== null ? 'types ' + keyName(d.key) : keyName(d.key);
      case 'sticky': return 'sticky ' + keyName(d.key) + ': applies to the next key you press';
      case 'layer':
        var n = layerName(layout, d.layer);
        if (d.how === 'hold') return n + ' layer while held';
        if (d.how === 'to') return 'switches the board to ' + n + ' (it stays there)';
        if (d.how === 'toggle') return 'turns ' + n + ' on or off';
        return 'hold: ' + n + ' layer while held; tap twice: switch to ' + n;
      case 'holdtap': return 'Tap: ' + words(layout, d.tap) + '. Hold: ' + holdWords(layout, d.hold) + '.';
      case 'macro':
        var parts = [];
        if (d.letsGo) parts.push('lets go of held modifiers');
        if (d.steps.length) parts.push((d.steps.every(printing) ? 'types ' : 'presses ') +
          d.steps.map(function (s) { return words(layout, s).replace(/^types /, ''); }).join(', then '));
        if (d.held.length) parts.push('holds ' + d.held.map(function (h) { return holdWords(layout, h); }).join(' and ') + ' until released');
        return parts.join('; ') || 'nothing';
      case 'none': return 'nothing';
      case 'trans': return 'pass-through';
      default: return d.words;
    }
  }

  function holdWords(layout, d) {
    if (d.kind === 'key' && MODS[d.key.code] && !d.key.mods.length) return keyName(d.key);
    if (d.kind === 'macro' && !d.steps.length && !d.letsGo)
      return d.held.map(function (h) { return holdWords(layout, h); }).join(' and ');
    return words(layout, d);
  }

  function printing(d) { return d.kind === 'key' && keyChar(d.key) !== null; }

  function cap(s) { return s.charAt(0).toUpperCase() + s.slice(1); }

  function danger(d) {
    return !!(d.danger || (d.kind === 'holdtap' && (danger(d.tap) || danger(d.hold))));
  }

  // --- Layer state, as ZMK resolves it ---------------------------------------
  // A state is the set of active layers (ascending) and the keys held to get there. A key press hits
  // the highest active layer whose key is not pass-through.

  var MODELS = typeof WeakMap !== 'undefined' ? new WeakMap() : null;
  var MAX_HOLDS = 3;

  // Per Layout: every binding resolved once, and the state searches done so far.
  function model(layout) {
    var m = MODELS && MODELS.get(layout);
    if (m) return m;
    m = { at: layout.layers.map(function (l) { return l.map(function (b) { return resolve(layout, b); }); }),
      states: {}, ways: {}, paths: {}, keys: null };
    if (MODELS) MODELS.set(layout, m);
    return m;
  }

  // The board's key positions (config/info.json), so Reach can tell thumb keys and name keys by place.
  function board(layout, keys) {
    var m = model(layout);
    m.keys = keys;
    // Thumb keys are info.json labels ending T<n>; none found means the labels changed, so ranking would silently break.
    if (!keys.some(function (k, i) { return thumb(m, i); })) throw new Error('Reach.board: no thumb keys in config/info.json (labels ending T<n>).');
    m.ways = {};
    m.paths = {};
  }

  function thumb(m, pos) { return !!(m.keys && m.keys[pos] && /(^|_)T\d+$/.test(m.keys[pos].label)); }

  // Where a key sits: its hand, and its row and column counted from the middle of the board.
  function place(m, pos) {
    var ks = m.keys, k = ks && ks[pos];
    if (!k) return 'key ' + pos;

  // Real lines for the second Symbol stage: shell, then Python. Built in, like the words.
  var CODE = [
    'ls -la ~/rs | grep -v "^d"',
    'cd "$(git rev-parse --show-toplevel)" && make',
    'git log --oneline -n 10 | cut -c1-7',
    'find . -name "*.py" -exec wc -l {} +',
    'echo "${HOME}/bin:$PATH" > /tmp/path.txt',
    'for f in *.md; do echo "$f"; done',
    'grep -rn "TODO" src/ 2>/dev/null || true',
    'tar -czf backup.tar.gz ~/notes && ls -lh *.gz',
    'export EDITOR=vim; [[ -n "$EDITOR" ]] && echo ok',
    'jq \'.layers[0] | length\' config/go60.json',
    'sed -i \'s/foo/bar/g\' a.txt; cat a.txt',
    'ps aux | awk \'{print $2, $11}\' | sort -n',

    'ssh -p 2222 user@host \'df -h /\'',

    'def add(a, b):',

    'if x is not None and len(xs) > 0:',
    'print(f"{i:>3}: {line!r}")',
    'with open(path, "w") as f: f.write(text)',
    'import os, sys; args = sys.argv[1:]',
    'xs = [n * 2 for n in range(10) if n % 3 == 0]',

    'class Point: x: int = 0; y: int = 0',

    'assert a[-1] == b[::-1][0], "mismatch"',
    'lambda s: s.strip().lower() != ""',
    '@dataclass(frozen=True)',
    'ok = x & mask | (y ^ 0xff) << 2',
    'path = os.path.join(root, "*.txt")'
  ];
  var CONTRACTIONS = "don't it's can't i'm you're we're isn't that's there's won't i've let's they're didn't".split(' ');

  // --- The engine ----------------------------------------------------------------
  // A drill is a list of tokens: a printing character, or (later drills) a key or chord name.
  // Each input is what the board sent; t is its time in ms.
  function engine(tokens) {
    var e = { tokens: tokens.slice(), pos: 0, errors: 0, blocked: false, start: null, end: null };
    e.done = function () { return e.pos >= e.tokens.length; };
    e.input = function (sent, t) {
      if (e.done()) return 'done';
      t = t === undefined ? Date.now() : t;
      if (e.start === null) e.start = t;
      if (sent !== e.tokens[e.pos]) { e.errors++; e.blocked = true; return 'wrong'; }
      e.pos++;
      e.blocked = false;
      if (!e.done()) return 'ok';
      e.end = t;
      return 'done';
    };
    // Accuracy: right presses over all presses. Words per minute: five tokens a word, first press to last.
    e.stats = function () {

      return { accuracy: n / (n + e.errors), wpm: ms > 0 ? (n / 5) / (ms / 60000) : 0, errors: e.errors, ms: ms };
    };
    return e;
  }

  // Lines of at most `width` tokens, not counting the space that ends one, broken after a space:
  // [start, end) index pairs.
  function wrap(tokens, width) {
    var lines = [], start = 0, brk = -1;
    for (var i = 0; i < tokens.length; i++) {
      if (tokens[i] !== ' ' && i - start >= width && brk > start) { lines.push([start, brk]); start = brk; }
      if (tokens[i] === ' ') brk = i + 1;
    }
    if (start < tokens.length) lines.push([start, tokens.length]);
    return lines;
  }

  // --- Letter stages, from the Layout's rows ------------------------------------------

  function letterOf(layout, pos) {
    var t = Reach.key(layout, 0, pos).types;
    return t && /^[a-z]$/.test(t) ? t : null;
  }

  // The home row is the row of the board description with the most home-row mods: letters that hold a modifier.
  var STAGES = typeof WeakMap !== 'undefined' ? new WeakMap() : null;

  function stages(layout, keys) {
    var memo = STAGES && STAGES.get(layout);
    if (!memo) { memo = build(layout, keys); if (STAGES) STAGES.set(layout, memo); }
    return memo;
  }

  function build(layout, keys) {
    var rows = {};
    keys.forEach(function (k, pos) { (rows[k.row] = rows[k.row] || []).push(pos); });
    var home = null, best = 0;
    Object.keys(rows).forEach(function (r) {
      var n = rows[r].filter(function (p) { return letterOf(layout, p) && Reach.key(layout, 0, p).mods.length; }).length;
      if (n > best) { best = n; home = Number(r); }
    });
    function letters(r) { return (rows[r] || []).map(function (p) { return letterOf(layout, p); }).filter(Boolean); }
    var h = home === null ? [] : letters(home), t = h.concat(letters(home - 1)), b = t.concat(letters(home + 1));
    var all = 'abcdefghijklmnopqrstuvwxyz'.split('').filter(function (c) { return Reach.reach(layout, c); });
    var punct = [',', '.', ';', "'"].filter(function (c) { return Reach.reach(layout, c); });
    var capsWord = !!Reach.reach(layout, 'Caps Word');
    var sym = symbolStages(layout);
    return [
      { name: 'Home row', letters: h },
      { name: 'Plus the top row', letters: t },
      { name: 'Plus the bottom row', letters: b },
      { name: 'All letters', letters: all },
      { name: 'Capitals' + (punct.length ? ', punctuation ' + punct.join(' ') : '') + (capsWord ? ' and Caps Word' : ''), letters: all, capitals: true,
        punct: punct, capsWord: capsWord }
    ].concat(sym);
  }

  // --- Symbol stages, from the layer that carries the symbols ------------------------

  // The path through `layer` with no modifier held: the one to teach for a symbol on it.
  function through(layout, c, layer) {
    return Reach.paths(layout, c, 0).filter(function (p) { return p.layer === layer && !p.mods.length; })[0] || null;
  }

  // The symbols layer n's own keys send, each reachable through n with no modifier held.
  function symbolsOn(layout, n) {
    var symbols = [];
    layout.layers[n].forEach(function (b, pos) {
      var k = Reach.key(layout, n, pos);
      if (k.kind === 'trans' || !k.types || k.types.length !== 1 || /[a-z0-9 ]/i.test(k.types)) return;
      if (symbols.indexOf(k.types) < 0 && through(layout, k.types, n)) symbols.push(k.types);
    });
    return symbols;
  }

  // The Symbol layer, whatever it is named: the layer, not a base mode, whose keys send the most symbols,
  // and more than the base does. Two stages either way; with no such layer, they fail loud when started.
  function symbolStages(layout) {
    var bases = Reach.bases(layout), n = null, symbols = symbolsOn(layout, 0);
    for (var l = 0; l < layout.layers.length; l++) {
      if (bases.indexOf(l) >= 0) continue;
      var s = symbolsOn(layout, l);
      if (s.length > symbols.length) { n = l; symbols = s; }
    }
    var missing = n === null ? 'no layer sends more symbols than the base does, so there is no Symbol layer to drill.' : null;
    if (missing) symbols = [];
    return [
      { name: 'Symbols: random groups', letters: [], symbols: symbols, layer: n, groups: true, missing: missing },
      { name: 'Symbols: shell and Python lines', letters: [], symbols: symbols, layer: n, code: true, missing: missing }
    ];
  }

  // Pieces joined by spaces, as many as fill LINES lines of `width`.
  function fill(next, width) {
    var tokens = [];
    for (;;) {
      var t = tokens.concat(tokens.length ? [' '] : [], next().split(''));
      if (wrap(t, width).length > LINES) return tokens;
      tokens = t;
    }
  }

  function symbolDrill(layout, st, rng, width) {
    if (st.missing) throw new Error(st.name + ': ' + st.missing);
    if (!Reach.reach(layout, ' ')) throw new Error(st.name + ': this Layout has no Space to put between pieces.');
    var pick = function (xs) { return xs[Math.floor(rng() * xs.length)]; };
    if (st.groups) return fill(function () {
      var g = '', len = 2 + Math.floor(rng() * 4);
      while (g.length < len) g += pick(st.symbols);
      return g;
    }, width);
    var lines = CODE.filter(function (l) { return l.split('').every(function (c) { return Reach.reach(layout, c); }); });
    if (!lines.length) throw new Error(st.name + ': no built-in line uses only keys this Layout can send.');
    return fill(function () { return pick(lines); }, width);
  }

  // A drill for stage n: random words that use only the stage's letters, filling LINES lines of WIDTH.
  function generate(layout, keys, n, rng, width) {
    var st = stages(layout, keys)[n];
    rng = rng || Math.random;
    width = width || WIDTH;
    if (st.symbols) return symbolDrill(layout, st, rng, width);
    var ok = {};
    st.letters.concat(st.capitals ? st.punct : []).forEach(function (c) { ok[c] = true; });
    var fits = function (w) { return w.split('').every(function (c) { return ok[c]; }); };
    var pool = WORDS.filter(fits).concat(st.capitals ? CONTRACTIONS.filter(fits) : []);
    if (!pool.length) throw new Error(st.name + ': no built-in word uses only this stage\'s letters (' + st.letters.join(' ') + ').');
    var has = function (c) { return st.punct && st.punct.indexOf(c) >= 0; };
    var tokens = [], sentence = true;
    for (;;) {
      var w = pool[Math.floor(rng() * pool.length)];
      if (st.capitals) {
        if (/^i('|$)/.test(w)) w = 'I' + w.slice(1);
        if (st.capsWord && w.length > 1 && /^[a-z]+$/.test(w) && rng() < 0.1) w = w.toUpperCase();
        else if (sentence) w = w.charAt(0).toUpperCase() + w.slice(1);
        sentence = false;
        var r = rng();
        if (r < 0.15 && has('.')) { w += '.'; sentence = true; }
        else if (r < 0.25 && has(',')) w += ',';
        else if (r < 0.3 && has(';')) w += ';';
      }
      var next = tokens.concat(tokens.length ? [' '] : [], w.split(''));
      if (wrap(next, width).length > LINES) return tokens;
      tokens = next;
    }
  }

  function isCap(c) { return /^[A-Z]$/.test(c || ''); }

  // The path to light for token i in stage st: the Reach path, except in a capitals word (two or more capitals),
  // which starts with Caps Word and goes on with plain letters, and in a Symbol stage, where a symbol
  // goes through the Symbol layer even if a base key also sends it.
  function hint(layout, tokens, i, st) {
    var c = tokens[i];
    if (st && st.symbols && st.symbols.indexOf(c) >= 0) return through(layout, c, st.layer);
    if (isCap(c) && (isCap(tokens[i - 1]) || isCap(tokens[i + 1]))) {
      var cw = Reach.reach(layout, 'Caps Word'), l = Reach.reach(layout, c.toLowerCase());
      if (cw && l && isCap(tokens[i - 1]))
        return { hold: l.hold, tap: l.tap, layer: l.layer, active: l.active, words: 'Caps Word is on: ' + l.words };
      if (cw && l && !cw.hold.length)
        return { hold: [], tap: cw.tap.concat(l.tap), layer: l.layer, active: l.active,
          words: cw.words.replace(/\.\s.*/, '') + ' (Caps Word), then type the word: it comes out in capitals.' };
    }
    return Reach.reach(layout, c);
  }

  // The key that shows or hides the picture, in a drill too: not a printing character, so no drill asks for it.
  var PICTURE = 'Tab';

  // What a key press means to a drill: 'picture', a character, 'chord' (a home-row mod that fired
  // instead of a letter), or null (a modifier alone, or a key that sends no character).
  function read(e) {
    if (e.key === PICTURE) return 'picture';
    if (/^(Shift|Control|Alt|AltGraph|Meta|OS|Super|Hyper|CapsLock|NumLock|ScrollLock|Fn|Dead|Unidentified)$/.test(e.key)) return null;
    if (e.ctrlKey || e.altKey || e.metaKey) return 'chord';
    return e.key.length === 1 ? e.key : null;
  }

  return { WIDTH: WIDTH, LINES: LINES, PICTURE: PICTURE, engine: engine, wrap: wrap, stages: stages, generate: generate,
    hint: hint, read: read };
})();

<script>
(function () {
  'use strict';
  var layout = JSON.parse(document.getElementById('data-layout').textContent);
  var keys = JSON.parse(document.getElementById('data-keys').textContent);
  Reach.board(layout, keys);
  var U = 54, GAP = 4, NS = 'http://www.w3.org/2000/svg';
  var names = Reach.layers(layout).map(function (l) { return l.name; });
  // layer: shown; active: the layers on (the route, which decides pass-through); hl: a path lit by search.
  var state = { layer: 0, active: Reach.route(layout, 0), pos: null, hl: null };

  document.getElementById('title').textContent = layout.title || '';

  var nav = document.getElementById('layers'), buttons = [];
  var bases = Reach.bases(layout);
  [['Base modes', function (l) { return bases.indexOf(l.index) >= 0; }],
   ['Layers', function (l) { return bases.indexOf(l.index) < 0; }]].forEach(function (g) {
    var group = document.createElement('div');
    group.className = 'group';
    var h = document.createElement('span');
    h.textContent = g[0] + ':';
    group.appendChild(h);
    Reach.layers(layout).filter(g[1]).forEach(function (l) {
      var b = document.createElement('button');
      b.textContent = l.name;
      b.onclick = function () { show(l.index); };
      buttons[l.index] = b;
      group.appendChild(b);
    });
    nav.appendChild(group);
  });

  function show(n, active) {
    state.layer = n;
    state.active = active || Reach.route(layout, n);
    state.hl = null;
    draw();
  }

  function el(name, attrs, parent) {
    var e = document.createElementNS(NS, name);
    for (var a in attrs) e.setAttribute(a, attrs[a]);
    if (parent) parent.appendChild(e);
    return e;
  }

  function html(tag, cls, text, parent) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text !== undefined) e.textContent = text;
    if (parent) parent.appendChild(e);
    return e;
  }

  function fit(s, n) { return s.length > n ? s.slice(0, n - 1) + '…' : s; }

  // A key's centre on the picture, after its rotation.
  // A point on a key, after its rotation: its centre moved by (dx, dy) key widths.
  function spot(k, dx, dy) {
    var x = (k.x + (k.w || 1) / 2 + dx) * U - GAP / 2, y = (k.y + (k.h || 1) / 2 + dy) * U - GAP / 2;
    if (!k.r) return [x, y];
    var a = k.r * Math.PI / 180, ox = k.rx * U, oy = k.ry * U;
    return [ox + (x - ox) * Math.cos(a) - (y - oy) * Math.sin(a), oy + (x - ox) * Math.sin(a) + (y - oy) * Math.cos(a)];
  }

  var svg = document.getElementById('board');
  var maxX = 0, maxY = 0;
  keys.forEach(function (k) { maxX = Math.max(maxX, k.x + 1); maxY = Math.max(maxY, k.y + 1.4); });
  svg.setAttribute('viewBox', [-GAP, -GAP, maxX * U + 2 * GAP, maxY * U + 2 * GAP].join(' '));

  function draw() {
    buttons.forEach(function (b, i) { b.setAttribute('aria-pressed', i === state.layer); });
    svg.textContent = '';
    var hl = state.hl || { hold: [], tap: [] };
    keys.forEach(function (k, pos) {
      var r = Reach.key(layout, state.layer, pos, state.active);
      var cls = 'k ' + r.kind + (r.danger ? ' danger' : '') + (pos === state.pos ? ' sel' : '') +
        (hl.hold.indexOf(pos) >= 0 ? ' h-hold' : '') + (hl.tap.indexOf(pos) >= 0 ? ' h-tap' : '');
      var g = el('g', { 'class': cls, transform: k.r ? 'rotate(' + k.r + ' ' + k.rx * U + ' ' + k.ry * U + ')' : '' }, svg);
      g.onclick = function () { state.pos = pos; draw(); };
      el('title', {}, g).textContent = r.words;
      var x = k.x * U, y = k.y * U, w = (k.w || 1) * U - GAP, h = (k.h || 1) * U - GAP;
      el('rect', { x: x, y: y, width: w, height: h, rx: 6 }, g);
      var tap = fit(r.tap, 7);
      var t = el('text', { 'class': 'tap', x: x + w / 2, y: y + (r.hold ? h * 0.38 : h / 2),
        'font-size': tap.length > 4 ? 10 : tap.length > 2 ? 13 : 17 }, g);
      t.textContent = tap;
      if (r.hold) el('text', { 'class': 'hold', x: x + w / 2, y: y + h * 0.78 }, g).textContent = fit(r.hold, 9);
    });
    // Combos: their keys linked, with the result at the middle.
    if (!drill.on && document.getElementById('show-combos').checked) {
      Reach.combos(layout, state.active).forEach(function (c) {
        var pts = c.keys.map(function (p) { return spot(keys[p], 0.32, 0.32); });
        var g = el('g', { 'class': 'combo' }, svg);
        el('title', {}, g).textContent = 'Combo: press these together. ' + c.words + '.';
        el('polyline', { points: pts.map(function (p) { return p.join(','); }).join(' ') }, g);
        pts.forEach(function (p) { el('circle', { cx: p[0], cy: p[1], r: 4 }, g); });
        var mx = pts.reduce(function (s, p) { return s + p[0]; }, 0) / pts.length;
        var my = pts.reduce(function (s, p) { return s + p[1]; }, 0) / pts.length;
        var label = fit(c.tap, 10), w = label.length * 6 + 8;
        el('rect', { x: mx - w / 2, y: my - 9, width: w, height: 18, rx: 4 }, g);
        el('text', { x: mx, y: my }, g).textContent = label;
      });
    }
    about();
    info();
  }

  // The layer's note, and each way to reach it; picking a way sets the layers on (and so the pass-through).
  function about() {
    document.getElementById('note').textContent = Reach.note(layout, state.layer);
    var box = document.getElementById('ways');
    box.textContent = '';
    var ws = Reach.ways(layout, state.layer), seen = {}, pressed = false;
    if (!ws.length) { html('div', 'where', 'No key turns this layer on.', box); return; }
    html('span', 'where', 'Reach it: ', box);
    ws.forEach(function (w) {
      var kind = w.base + w.how + w.active.join();
      if (seen[kind]) return;
      seen[kind] = true;
      var b = html('button', '', Reach.wayWords(layout, w), box);
      var on = !pressed && w.active.join() === state.active.join();
      pressed = pressed || on;
      b.setAttribute('aria-pressed', on);
      b.title = 'Layers on: ' + w.active.map(function (l) { return names[l]; }).join(', ') + '. Pass-through keys follow this route.';
      b.onclick = function () { state.active = w.active; state.hl = { hold: w.hold, tap: w.tap === null ? [] : [w.tap] }; draw(); };
    });
  }

  function info() {
    var box = document.getElementById('info');
    box.textContent = '';
    if (state.pos === null) { box.textContent = 'Select a key.'; return; }
    var r = Reach.key(layout, state.layer, state.pos, state.active);
    html('div', 'where', names[state.layer] + ' · ' + (keys[state.pos].label || 'key ' + state.pos), box);
    html('div', '', r.words, box);
    if (r.danger) html('div', 'danger', 'Careful: this key reboots, unpairs or reflashes the board.', box);
  }

  // Search: where does this character or key live, and what do I hold?
  var search = document.getElementById('search'), found = document.getElementById('found');
  function find() {
    var q = search.value;
    if (!q) { found.textContent = ''; state.hl = null; draw(); return; }
    var p = Reach.reach(layout, q);
    if (!p) { found.textContent = 'Not on the board (from ' + names[0] + ').'; state.hl = null; draw(); return; }
    state.layer = p.layer;
    state.active = p.active;
    state.hl = { hold: p.hold, tap: p.tap };
    state.pos = p.tap.length ? p.tap[0] : p.hold[p.hold.length - 1];
    found.textContent = p.words;
    draw();
  }
  search.addEventListener('input', find);
  search.addEventListener('keydown', function (e) { if (e.key === 'Escape') { search.value = ''; find(); search.blur(); } });
  document.getElementById('show-combos').addEventListener('change', draw);

  // --- Drill: a menu picked from the keyboard, then three lines to type with the next key lit ---
  var drill = { on: false, stage: 0, eng: null, lines: [], pic: true };
  var stages = Drill.stages(layout, keys);
  var dmenu = document.getElementById('drill-menu'), dtext = document.getElementById('drill-text');
  var dstats = document.getElementById('drill-stats'), dhint = document.getElementById('drill-hint');

  function setMode(on) {
    drill.on = on;
    drill.eng = null;
    document.body.classList.toggle('drilling', on);
    document.getElementById('drill').hidden = !on;
    document.getElementById('mode').textContent = on ? 'Drill' : 'Explore';
    if (on) render(); else show(0);
  }

  function start(n) {
    drill.stage = n;
    var tokens;
    try { tokens = Drill.generate(layout, keys, n); }
    catch (err) { drill.eng = null; render(); dstats.textContent = 'Cannot start this drill. ' + err.message; return; }
    drill.lines = Drill.wrap(tokens, Drill.WIDTH);
    drill.eng = Drill.engine(tokens);
    render();
  }

  function render() {
    dmenu.textContent = dtext.textContent = dstats.textContent = dhint.textContent = '';
    document.body.classList.toggle('nopic', !drill.pic);
    var e = drill.eng;
    if (!e) {
      html('div', '', 'Pick a stage: press its number (Enter repeats the last one).', dmenu);
      var ol = html('ol', '', undefined, dmenu);
      stages.forEach(function (st, i) {
        var li = html('li', '', st.name + ' ', ol);
        li.setAttribute('aria-current', i === drill.stage);
        html('span', 'letters', st.symbols ? st.symbols.join(' ') : st.letters.join(' ').toUpperCase(), li);
      });
      html('div', 'where', Drill.PICTURE + ': picture ' + (drill.pic ? 'on' : 'off') + ', here or in a drill · Esc: back to Explore. ' +
        'In a drill: a wrong key holds you until you press the right one; Esc comes back here.', dmenu);
      state.layer = 0; state.active = Reach.route(layout, 0); state.hl = null; state.pos = null;
      draw();
      return;
    }
    drill.lines.forEach(function (ln) {
      var div = html('div', '', undefined, dtext);
      for (var i = ln[0]; i < ln[1]; i++)
        html('span', i < e.pos ? 'done' : i === e.pos ? 'cur' + (e.blocked ? ' bad' : '') : '', e.tokens[i], div);
    });
    if (e.done()) {
      var st = e.stats();
      dstats.textContent = 'Accuracy ' + Math.round(st.accuracy * 100) + '% · ' + Math.round(st.wpm) + ' wpm · ' +
        st.errors + ' error' + (st.errors === 1 ? '' : 's') + '. Space or Enter: a new drill. Esc: pick a stage.';
      state.hl = null;
      draw();
      return;
    }
    var p = Drill.hint(layout, e.tokens, e.pos, stages[drill.stage]);
    dstats.textContent = stages[drill.stage].name + ' · ' + Drill.PICTURE + (drill.pic ? ' hides' : ' shows') + ' the picture' + (e.errors ? ' · ' + e.errors + ' error' + (e.errors === 1 ? '' : 's') : '');
    if (p) {
      if (drill.pic) dhint.textContent = p.words;
      state.layer = p.layer; state.active = p.active; state.hl = { hold: p.hold, tap: p.tap }; state.pos = null;
    }
    draw();
  }

  function drillKey(e) {
    if (e.key === 'Escape') { if (drill.eng) { drill.eng = null; render(); } else setMode(false); return true; }
    var sent = Drill.read(e);
    if (sent === 'picture') { drill.pic = !drill.pic; render(); return true; }
    if (!drill.eng) {
      var n = Number(e.key);
      if (/^[1-9]$/.test(e.key) && n <= stages.length) start(n - 1);
      else if (e.key === 'Enter') start(drill.stage);
      else return false;
      return true;
    }
    if (drill.eng.done()) {
      if (e.key !== ' ' && e.key !== 'Enter') return false;
      start(drill.stage);
      return true;
    }
    if (sent === null) return false;
    drill.eng.input(sent, e.timeStamp);
    render();
    return true;
  }

  document.addEventListener('keydown', function (e) {
    if (drill.on) { if (drillKey(e)) e.preventDefault(); return; }
    if (e.target === search) return;
    if (e.key === '/') { e.preventDefault(); search.focus(); return; }
    if (e.key === 'd') { e.preventDefault(); setMode(true); return; }
    var n = names.length;
    if (e.key === 'ArrowRight') show((state.layer + 1) % n);
    else if (e.key === 'ArrowLeft') show((state.layer + n - 1) % n);
    else return;
    e.preventDefault();
  });

  draw();
})();
</script>
</body>
</html>
