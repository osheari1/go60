name: Build

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/checkout@v4
        with:
          repository: moergo-sc/zmk
          # Pinned firmware: an upgrade is a deliberate commit here.
          ref: v26.09
          path: src
      - name: Tests (golden Keymap, stale Keymap, import, flash, trainer)
        run: tests/run
      - uses: cachix/install-nix-action@v25
        with:
          nix_path: nixpkgs=channel:nixos-22.05
      - uses: cachix/cachix-action@v14
        with:
          name: moergo-glove80-zmk-dev
          skipPush: true
      - name: Build Go60 combined firmware
        run: nix-build config -o combined
      - name: Copy result out of nix store
        run: cp combined/go60.uf2 go60.uf2
      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: go60.uf2
          path: go60.uf2

  # Release: every green push to main gets the next v<N> tag (see .github/tag).
  tag:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # One tag run at a time, so two quick pushes don't both pick the same v<N>.
    concurrency:
      group: tag
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Tag v<N+1>
        run: .github/tag
